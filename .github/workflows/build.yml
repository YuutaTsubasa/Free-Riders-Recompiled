# Builds and tests everything that does not need the game: the recompiler
# tools, the runtime and its tests, the launcher (Windows, Linux) and the
# Android launcher libraries. The game itself is C++ generated from each
# player's own default.xex (scripts/prepare_recomp.py), so no workflow can
# build or ship it, and no game file is ever fetched here.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the pinned dependencies
        run: python scripts/bootstrap.py
      - name: Build tools, runtime tests and launcher
        shell: pwsh
        run: ./scripts/build_tools.ps1 -Jobs 4
      # The graphics tests need a D3D12 GPU (WARP lacks the features); they run
      # on Linux against software Vulkan.
      - name: Test
        run: ctest --test-dir out/build/host -j 4 --output-on-failure -E "^(native_graphics|native_shaders|native_presentation|native_raster_state|native_blend_control|guest_graphics|guest_render_state|guest_blend_request|guest_sampler_filter|guest_texture_binding)$"
      - name: Python tests (game-file tests skip)
        run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-windows
          path: out/build/host/FreeRidersRecompiled.exe

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 ninja-build pkg-config libsdl2-dev libx11-dev mesa-vulkan-drivers xvfb
      - name: Fetch the pinned dependencies
        run: python scripts/bootstrap.py
      - name: Build
        run: SFR_LINUX_BUILD="$PWD/out/build/linux" scripts/build_linux.sh
      - name: Test (software Vulkan in a virtual display)
        run: xvfb-run -a ctest --test-dir out/build/linux -j 4 --output-on-failure
      - name: Python tests (game-file tests skip)
        run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-linux
          path: out/build/linux/FreeRidersRecompiled

  macos:
    name: macOS (build check)
    # Apple Silicon: 16 KiB pages and no Vulkan driver on the runner, so this
    # only checks that the runtime and launcher build and their CPU-side tests
    # pass; the game has not been run on a Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        # Homebrew's LLVM: its libc++ has std::jthread and std::atomic_ref,
        # which Apple's does not yet.
        run: |
          brew install ninja sdl2 llvm
          llvm="$(brew --prefix llvm)"
          echo "CC=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm/bin/clang++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$llvm/lib/c++ -L$llvm/lib/unwind -lunwind -Wl,-rpath,$llvm/lib/c++" >> "$GITHUB_ENV"
      - name: Fetch the pinned dependencies
        run: python scripts/bootstrap.py
      - name: Build
        run: |
          # On failure, keep going once more to list every error, not just the first.
          SFR_LINUX_BUILD="$PWD/out/build/macos" scripts/build_linux.sh ||
            { ninja -C out/build/macos -k 0 2>&1 | grep -E "error:|undefined" | sort -u | head -80; exit 1; }
      - name: Test
        run: ctest --test-dir out/build/macos -j 4 --output-on-failure -E "^(native_graphics|native_shaders|native_presentation|native_raster_state|native_blend_control|guest_graphics|guest_render_state|guest_blend_request|guest_sampler_filter|guest_texture_binding)$"

  android:
    name: Android (launcher)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the pinned dependencies
        run: python scripts/bootstrap.py
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the launcher and SDL for both ABIs
        run: |
          export SFR_ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          scripts/build_android.sh --launcher-only --abi arm64-v8a --abi x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: android-launcher-libraries
          path: android/app/src/main/jniLibs
