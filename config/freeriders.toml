# A path that carries a racer (8231CA00, #410: Metropolis Speedway Expert's
# launch up the building and the drop after it). Its speed (+232) slows by a
# fixed amount each update (8231CAD0) and speeds up by speed squared times a
# constant (8231CB60), and the racer is pulled to the path by at most a fixed
# distance (8231CCEC): all three scaled to the step. Where the launch starts
# to crawl (8231CC40, the speed copied into +236), the copy waits a frame, as
# it did at one frame a step (RaceLaunchSpeedHoldMidAsmHook).
[[midasm_hook]]
name = "RaceShortStepScaleMidAsmHook"
address = 0x8231CAD0
registers = ["f4"]

[[midasm_hook]]
name = "RaceShortStepScaleMidAsmHook"
