# Final Factory Expert's skydive (8239F518, #410) carries its racer down to a
# point it sets, the racer's height less its fall speed (+100 of the racer's
# slot), at 8239FC6C. The speed changes by a fixed amount each update: 0.0062
# towards its target speed (823A0118, 823A012C, 823A01A4) and 0.077 down to its
# floor while it is held back (8239FB94). None of them were multiplied by the step, so
# at 144 Hz the racer fell 2.4 times as fast (233 a second, not 97).
[[midasm_hook]]
name = "RaceShortStepScaleMidAsmHook"
address = 0x8239FC6C
registers = ["f13"]

[[midasm_hook]]
name = "RaceShortStepSubtractMidAsmHook"
address = 0x8239FB94
registers = ["f0", "f14"]

[[midasm_hook]]
name = "RaceShortStepAddMidAsmHook"
address = 0x823A0118
registers = ["f0", "f28"]

[[midasm_hook]]
name = "RaceShortStepSubtractMidAsmHook"
address = 0x823A012C
registers = ["f0", "f28"]

[[midasm_hook]]
name = "RaceShortStepAddMidAsmHook"
address = 0x823A01A4
registers = ["f0", "f28"]

# Rocky Ridge's minecart (8235AA48, #410, #401): its lever turns to the side
# the rider leans over 20 frames (+364, counted down by the step) at a speed
# per update (+360), but every update added the whole speed (8235AB48), so a
# short step turned it 60/N times as far. Each lean the other way overshot more
# than the last, until the lever hung upside down under the cart. The speed is
# scaled to the frames this update spent (RaceLeverTurnMidAsmHook).
[[midasm_hook]]
name = "RaceLeverTurnMidAsmHook"
address = 0x8235AB48
registers = ["f13", "f11"]

# The jump into the minecart (822B8D70) slows its racer every update by
# speed -= step * decel (822B8E04), with decel set on entry as speed times a
# constant times the step again (822B8FD8 to 822B9018). A short step slowed
# the racer by step squared: it flew higher and farther, and boarded 10 units
# off the cart instead of 3. The entry's step is taken as one frame
# (RaceStepAsFrameMidAsmHook), as at 60 Hz.
[[midasm_hook]]
name = "RaceStepAsFrameMidAsmHook"
address = 0x822B8FD8
registers = ["f11"]
after_instruction = true

