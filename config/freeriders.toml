# Source: default.xex SHA-256 3d58636bec9b92948f7dbe423c0aa96753349ba014194c4e62d2f809c14643a7.
# Addresses found in this game's decoded .text; never copied from another game.
[main]
file_path = "../private/game/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "../out/switches.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

restgprlr_14_address = 0x82A56080
savegprlr_14_address = 0x82A56030
restfpr_14_address = 0x82A5712C
savefpr_14_address = 0x82A570E0
restvmx_14_address = 0x82A58848
savevmx_14_address = 0x82A585B0
restvmx_64_address = 0x82A588DC
savevmx_64_address = 0x82A58644

# Words the linear code sweep must step over. Without these, the sweep decodes
# them as instructions and splits .pdata functions into fragments.
# - 0x00000000: padding between functions.
# - 0x82A5C368 / 0x82ACB76C: the two C++ exception handlers stored, with one
#   handler-data word, immediately before each exception-flagged .pdata
#   function. Each word occurs in .text exactly as often as .pdata flags its
#   handler (1557 and 77), so no executable instruction is skipped.
invalid_instructions = [
    { data = 0x00000000, size = 4 },
    { data = 0x82A5C368, size = 8 },
    { data = 0x82ACB76C, size = 8 },
]

# setjmp/longjmp and nonstandard switch patterns still require analysis.
# No speculative function boundaries.

# Functions without .pdata whose extent XenonRecomp misjudges. Each is
# verified from the disassembly: contiguous code, every internal branch target
# inside the range, the fragments referenced only from it.
# - 0x82820BD8..0x82820E34 (then padding): HRESULT-to-code mapping. Its bdzf case chain at
#   0x82820D58 and many compares branch to 0x82820D74..0x82820E2C, which the
#   automatic sizing split into separate two-instruction "functions" and left
#   0x82820DE0 as an unreachable label.
functions = [
    { address = 0x82820BD8, size = 0x25C },
]

# Mid-asm hooks (XenonRecomp's format, as Unleashed Recompiled patches its
# game): the generated code calls the named function in src/ at the address,
# with references to the registers listed. Each is verified in the disassembly.

# Job 823B5D40 waits 16 ms (r6) for its helper threads with sub_824D0B10 at
# 0x823B5E9C and goes on whatever the result; slower helpers overran it and a
# race start then ran a reset item's callback (R6025). The wait gets
# SFR_WORK_SHARE_WAIT_MS instead (game_patches.cpp), set before the call...
[[midasm_hook]]
name = "WorkShareWaitMidAsmHook"
address = 0x823B5E98
registers = ["r6"]

# ...and after it returns (r3 = 0x102 on a timeout), the helpers still inside
# a job are waited for before the batch is reset.
[[midasm_hook]]
name = "WorkShareWaitDoneMidAsmHook"
address = 0x823B5E9C
registers = ["r3"]
after_instruction = true

# Job helpers (game_patches.cpp): a helper's time inside a job, which the
# work-share wait above and deferred deletion wait for, starts when it takes
# a job from the queue (82750B30 at 0x823B60F4) and ends when the take fails
# or it signals done (SetEvent at 0x823B614C).
[[midasm_hook]]
name = "HelperQueueTakeMidAsmHook"
address = 0x823B60F4

[[midasm_hook]]
name = "HelperQueueTakenMidAsmHook"
address = 0x823B60F8
registers = ["r3"]

[[midasm_hook]]
name = "HelperDoneMidAsmHook"
address = 0x823B614C

# Worker 824C39C8 signals done (SetEvent at 0x824C3A38) and then suspends
# itself; its suspension is registered first, so a resume that a phone runs
# between the two is not lost.
[[midasm_hook]]
name = "WorkerDoneMidAsmHook"
address = 0x824C3A38
