# these truncates the step to a whole number of frames for an integer timer
# (a jump's arc, 822C09A0: timer -= int(frames), height from timer squared).
# A step of half a frame truncates to 0 and the timer stops, so a racer in
# the air never comes down. The hook gives the frames the step completed.
[[midasm_hook]]
name = "RaceWholeFramesMidAsmHook"
address = 0x822C0A30
registers = ["f12"]
after_instruction = true

