# The camera's blend from one view to the next (824B08C0, at the start of a
# race and around jumps) counts its frames the same way, its step reached
# through 82211440 rather than the global, so the search for the 19 above
# missed it. Truncated to 0, the blend never ended: the view stayed between
# the start camera and the racer's, behind or looking down on him.
[[midasm_hook]]
name = "RaceWholeFramesMidAsmHook"
address = 0x824B0CCC
registers = ["f0"]
after_instruction = true

# A racer carried by a course object (state 0, +2376) moves without the step:
# 822A9F58 multiplies the motion by it only in the other states (822AA298).
# With mode 0 (+2392) the motion is the racer's own speed per frame, so a short
# step moved it 2.4 times as far a second at 144 Hz, and Forgotten Tomb's
# launcher after the falling pillars threw it past the landing (#401).
[[midasm_hook]]
name = "RaceCarriedMotionMidAsmHook"
address = 0x822AA2D0
registers = ["r1", "r30"]

# Grab poles (822EB1F0, Final Factory's reach-up pole): the pole moves its
# racer along by a fixed distance each update (+84 added to the position at
# 822EB3B8, 822EB498, 822EB530). Scaled to the short step.
[[midasm_hook]]
name = "RaceShortStepScaleMidAsmHook"
address = 0x822EB3B8
registers = ["f13"]

[[midasm_hook]]
name = "RaceShortStepScaleMidAsmHook"
address = 0x822EB498
registers = ["f13"]

[[midasm_hook]]
